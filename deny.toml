# cargo-deny policy: core's (core/deny.toml) for the crates the app's graph
# shares with core, and what the app adds: Tauri's cryptography, wrapped like
# the rest, and the crates no shell may use. `cargo deny check` runs in the
# gate and on every push.

[graph]
all-features = true
# What the app builds for: the phones it ships for, and the hosts CI tests
# on. Tauri is a dependency on the phones only, but cargo-deny judges its
# desktop back ends for the hosts too (GTK and WebKitGTK on Linux, AppKit on
# macOS), which never build here.
targets = [
  "aarch64-linux-android",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
# No db-path: cargo-deny keeps its clones in its default, $CARGO_HOME/advisory-dbs
# (cargo-audit's own clone is ~/.cargo/advisory-db, which a cargo-deny
# checkout there would block).
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# The same list as .cargo/audit.toml's, for cargo-audit.
ignore = [
  # paste is archived, not vulnerable: a build-time proc macro beneath
  # netlink-packet-core 0.8, beneath if-watch 3.2.2, which libp2p-tcp and
  # libp2p-quic use to watch interfaces (core's deny.toml lists it too). Goes
  # when an if-watch release moves to netlink-packet-core 0.9.
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained build-time proc macro beneath if-watch's netlink crates; no maintained path yet" },
  # proc-macro-error is unmaintained, and glib 0.18 has an unsound iterator:
  # both beneath GTK, Tauri's Linux desktop back end, which the app never
  # builds (Tauri is a dependency on Android and iOS only).
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: beneath gtk, Tauri's Linux desktop back end, never built" },
  { id = "RUSTSEC-2024-0429", reason = "glib: beneath gtk, Tauri's Linux desktop back end, never built" },
]

[licenses]
version = 2
allow = [
  "MPL-2.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Cryptography comes only from the approved crates of core's spec/suites.md
# (TM-5): each entry's `wrappers` are the only crates allowed to depend on it
# directly (suites.md section 3.1). The entries for the crates the app shares
# with core are core's; a change there changes them here.
deny = [
  { crate = "openssl", reason = "rustls on aws-lc-rs is the TLS stack" },
  { crate = "openssl-sys", reason = "rustls on aws-lc-rs is the TLS stack" },
  { crate = "md5", reason = "not an approved primitive" },
  { crate = "sha1", reason = "not an approved primitive" },
  { crate = "rust-crypto", reason = "unmaintained" },
  # The shell contacts no host (TM-31), and Tauri's TLS features (its HTTP
  # client's rustls-tls and native-tls) may not be on (suites.md 3.1).
  { crate = "native-tls", reason = "Tauri's native-tls feature may not be on" },
  # Tauri on the phones depends on reqwest, without TLS, for one thing: a
  # proxy to a development server, code under its `dev` cfg, which
  # `custom-protocol` (mobile/Cargo.toml) turns off. So reqwest is compiled
  # for the phones and not linked.
  { crate = "reqwest", wrappers = ["tauri"], reason = "Tauri's development-server proxy, compiled out by custom-protocol: compiled, not linked (TM-31)" },
  { crate = "tauri-plugin-updater", reason = "no updater (TM-29)" },
  # core: the keys crate's primitives, and libp2p-identity's.
  { crate = "blake3", wrappers = ["licketysync-keys"], reason = "labelled hashing lives in licketysync-keys" },
  { crate = "constant_time_eq", wrappers = ["blake3"], reason = "BLAKE3's hash comparison, inside blake3 only" },
  { crate = "chacha20poly1305", wrappers = ["licketysync-keys"], reason = "the AEAD of suite 1, used through licketysync-keys only" },
  { crate = "ed25519-dalek", wrappers = ["licketysync-keys", "libp2p-identity"], reason = "Ed25519 lives in licketysync-keys, and in libp2p-identity for the libp2p identity key only" },
  { crate = "bip39", wrappers = ["licketysync-keys"], reason = "the write key's words live in licketysync-keys" },
  { crate = "curve25519-dalek", wrappers = ["ed25519-dalek"], reason = "reached only through ed25519-dalek" },
  { crate = "fiat-crypto", wrappers = ["curve25519-dalek"], reason = "reached only through curve25519-dalek" },
  { crate = "ed25519", wrappers = ["ed25519-dalek"], reason = "reached only through ed25519-dalek" },
  { crate = "signature", wrappers = ["ed25519"], reason = "reached only through ed25519-dalek" },
  # The app: SHA-256 of the scripts and styles the content security policy
  # lists by hash, computed by tauri-codegen at build time and by wry on
  # Android for its initialization scripts (suites.md 3.1, Tauri's row).
  { crate = "sha2", wrappers = ["ed25519-dalek", "libp2p-identity", "tauri-codegen", "wry"], reason = "Ed25519's SHA-512 through ed25519-dalek; SHA-256 inside libp2p-identity; the content security policy's hashes in tauri-codegen and wry" },
  { crate = "hkdf", wrappers = ["libp2p-identity"], reason = "QUIC's stateless-reset key, derived inside libp2p-identity only" },
  { crate = "hmac", wrappers = ["hkdf"], reason = "reached only through hkdf in libp2p-identity" },
  { crate = "chacha20", wrappers = ["chacha20poly1305", "rand"], reason = "never without the MAC, except as rand's generator" },
  { crate = "poly1305", wrappers = ["chacha20poly1305"], reason = "never without the cipher" },
  { crate = "universal-hash", wrappers = ["poly1305", "polyval"], reason = "reached only through chacha20poly1305, and ghash in Tauri's AES-GCM" },
  { crate = "ctutils", wrappers = ["universal-hash", "digest"], reason = "constant-time comparison inside the MAC crates only" },
  { crate = "cmov", wrappers = ["ctutils"], reason = "reached only through ctutils" },
  { crate = "cipher", wrappers = ["chacha20", "chacha20poly1305", "aes", "aes-gcm", "ctr"], reason = "reached only through chacha20poly1305, and Tauri's AES-GCM" },
  { crate = "aead", wrappers = ["chacha20poly1305", "aes-gcm"], reason = "reached only through chacha20poly1305, and Tauri's AES-GCM" },
  { crate = "bitcoin_hashes", wrappers = ["bip39"], reason = "the words' checksum SHA-256, inside bip39 only" },
  # The libp2p crates' and quinn-proto's own generators (suites.md 3.1);
  # first-party randomness is getrandom (suites.md 4.3).
  { crate = "rand", wrappers = ["libp2p-core", "libp2p-quic", "libp2p-swarm", "quinn-proto"], reason = "the libp2p crates' and quinn's generators" },
  { crate = "rand_pcg", wrappers = ["quinn-proto"], reason = "quinn-proto's own generator" },
  { crate = "pkcs8", reason = "no first-party key is read or written as PKCS#8" },
  { crate = "der", reason = "no first-party key is read or written as DER" },
  { crate = "spki", reason = "no first-party key is read or written as SPKI" },
  # core: the transport (suites.md 2.6 and 3.1).
  { crate = "ring", wrappers = ["libp2p-tls", "rcgen", "quinn-proto", "libp2p-quic"], reason = "the libp2p TLS certificate and quinn-proto's own reset, token and Retry crypto, inside the transport crates only" },
  { crate = "rustls", wrappers = ["libp2p-tls", "futures-rustls", "quinn", "quinn-proto", "licketysync-net"], reason = "TLS 1.3 for QUIC and TCP through libp2p-tls and libp2p-quic; net installs the provider" },
  { crate = "aws-lc-rs", wrappers = ["rustls", "rustls-webpki", "quinn-proto", "rcgen"], reason = "rustls's crypto provider and rustls-webpki's verification; never called directly" },
  { crate = "aws-lc-sys", wrappers = ["aws-lc-rs"], reason = "reached only through aws-lc-rs" },
  { crate = "rustls-webpki", wrappers = ["rustls", "libp2p-tls"], reason = "certificate parsing beneath rustls and libp2p-tls" },
  { crate = "rcgen", wrappers = ["libp2p-tls"], reason = "the libp2p TLS certificate, generated inside libp2p-tls only" },
  { crate = "libp2p-tls", wrappers = ["licketysync-net", "libp2p-quic"], reason = "the transport's TLS, used by net and libp2p-quic only" },
  { crate = "quinn", wrappers = ["libp2p-quic"], reason = "QUIC beneath libp2p-quic only" },
  { crate = "quinn-proto", wrappers = ["quinn", "libp2p-quic"], reason = "QUIC beneath libp2p-quic only" },
  # The app: Tauri's isolation pattern (TM-27). The isolation frame encrypts
  # each message's arguments to the shell with AES-256-GCM (the WebView's
  # WebCrypto), and tauri-utils decrypts them under a key drawn with getrandom
  # when the app starts. It protects only IPC inside the app's own process,
  # never the network or the disk, and does not authenticate the command name:
  # the capability's command list is the boundary (suites.md 3.1, Tauri's row).
  { crate = "aes-gcm", wrappers = ["tauri-utils"], reason = "the isolation pattern's message encryption inside tauri-utils only" },
  { crate = "aes", wrappers = ["aes-gcm"], reason = "beneath Tauri's AES-GCM only" },
  { crate = "ctr", wrappers = ["aes-gcm"], reason = "beneath Tauri's AES-GCM only" },
  { crate = "ghash", wrappers = ["aes-gcm"], reason = "beneath Tauri's AES-GCM only" },
  { crate = "polyval", wrappers = ["ghash"], reason = "beneath Tauri's AES-GCM only" },
  # idna (url, beneath multiaddr) stays on its ASCII-only back end,
  # idna_adapter's 1.0 line (core's deny.toml says why); urlpattern, beneath
  # tauri-utils (the capabilities' URL patterns), reads Unicode properties.
  { crate = "icu_normalizer", reason = "idna stays ASCII-only (idna_adapter 1.0)" },
  { crate = "icu_properties", wrappers = ["urlpattern"], reason = "idna stays ASCII-only (idna_adapter 1.0); urlpattern's Unicode properties beneath tauri-utils" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The core crates, at CORE_REV (mobile/Cargo.toml).
allow-git = ["https://github.com/licketysync/core"]
