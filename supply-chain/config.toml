
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[[exemptions.aead]]
version = "0.5.2"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-net, spike B, feature webtransport): AEAD traits beneath snow's chacha20poly1305 0.10 and aes-gcm (deny.toml wrappers); RustCrypto. Not covered by the imported audits at this version."

[[exemptions.aead]]
version = "0.6.1"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-keys): AEAD traits beneath chacha20poly1305 (deny.toml wrapper); RustCrypto. Not covered by the imported audits at this version."

[[exemptions.aes]]
version = "0.8.4"
criteria = "safe-to-deploy"
notes = "Phase 0 exemption (licketysync-net, spike B, feature webtransport): AES beneath aes-gcm in snow's RustCrypto resolver, compiled on wasm32 only and never selected by libp2p-noise (deny.toml-wrapped to aes-gcm); RustCrypto. Not covered by the imported audits at this version."

[[exemptions.aes-gcm]]
version = "0.10.3"
criteria = "safe-to-deploy"
