# Version updates wait 7 days after a release (the stay-current rule in the
# project's CLAUDE.md); cooldown does not apply to security updates, which come
# at once. Actions are pinned by commit with the release tag in a comment,
# which Dependabot rewrites when it moves the pin. The core crates are a git
# dependency pinned by rev to CORE_REV (ci/pins.env), which moves by a change
# of its own, so Dependabot leaves them alone.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "licketysync-*"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # The Android project Tauri generated: the Gradle wrapper, the Android
  # Gradle plugin, Kotlin and the AndroidX libraries.
  - package-ecosystem: gradle
    directory: "/mobile/gen/android"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
