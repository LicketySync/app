# The app's checks, on every push to main and every pull request: gate.sh's
# steps but clippy for Android and the merged manifest, which android.yml
# runs beside the APKs.
#
# Pinning rule (core's .github/workflows/ci.yml header): every action is pinned
# by full commit SHA with its release tag in a comment, and every tool and
# Rust toolchain by exact version, written once in ci/pins.env. Each job's
# first step after its checkout adds the pins to its environment
# (ci/pins-to-env.sh, which also sets RUSTUP_TOOLCHAIN), and every version
# below reads them from there; ci/check-pins.sh checks that no workflow holds
# a copy. The core crates are a git dependency at CORE_REV; core's scripts and
# Semgrep rules run from cargo's checkout of it (ci/core-dir.sh).
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, tests, rustdoc, udeps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - run: app/ci/pins-to-env.sh >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          cache-workspace-crates: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-udeps@${{ env.CARGO_UDEPS }}
          fallback: none
      - run: cargo fmt --all --check
        working-directory: app
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: app
      - run: cargo test --locked --workspace
        working-directory: app
      - run: cargo doc --locked --workspace --no-deps --document-private-items
        working-directory: app
        env:
          RUSTDOCFLAGS: -D warnings
      # `+toolchain` outranks RUSTUP_TOOLCHAIN.
      - run: cargo "+$RUST_NIGHTLY" udeps --locked --workspace --all-targets
        working-directory: app

  deps:
    name: cargo-deny, cargo-audit, check-chrono, cargo-machete, cargo-vet, typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - run: app/ci/pins-to-env.sh >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@${{ env.CARGO_DENY }},cargo-audit@${{ env.CARGO_AUDIT }},cargo-machete@${{ env.CARGO_MACHETE }},typos@${{ env.TYPOS }}
          fallback: none
      - run: cargo install cargo-vet --version "$CARGO_VET" --locked
      - run: cargo deny check
        working-directory: app
      - run: cargo audit --deny warnings
        working-directory: app
      - run: app/ci/check-chrono.sh
      - run: cargo machete
        working-directory: app
      - run: cargo vet --locked
        working-directory: app
      - run: typos
        working-directory: app

  # Semgrep with core's project rules (TM-7), no-hostnames, the pinning rule
  # and the tests of the CI scripts, all from core's checkout where they are
  # core's (gate.sh says which apply and why).
  rules:
    name: Semgrep, no-hostnames, pins, CI script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - run: app/ci/pins-to-env.sh >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - run: echo "CORE_DIR=$(app/ci/core-dir.sh)" >> "$GITHUB_ENV"
      - name: Semgrep, core's project rules over the app
        run: |
          docker run --rm --network none -v "$PWD/app:/src" -v "$CORE_DIR:/core:ro" -w /src \
            "semgrep/semgrep:$SEMGREP@$SEMGREP_IMAGE_DIGEST" \
            semgrep scan --metrics=off --disable-version-check \
              --config /core/.semgrep/project.yml --config /core/.semgrep/manifests.yml \
              --error --disable-nosem --max-target-bytes=0 --no-exclude-binary-files \
              --timeout-threshold=0 --timeout 60 .
      - run: app/ci/no-hostnames.sh
      - run: app/ci/check-pins.sh
      - run: '"$CORE_DIR/ci/pinned-actions.sh" app/.github/workflows'
      - run: app/ci/test-check-pins.sh
      - run: app/ci/test-check-manifest.sh
      - run: app/ci/test-check-chrono.sh

  # The gitleaks command-line tool, installed by core's script (its pin and
  # checksum are core's ci/pins.env), over the app's whole history.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          fetch-depth: 0
          persist-credentials: false
      - run: app/ci/pins-to-env.sh >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - run: echo "CORE_DIR=$(app/ci/core-dir.sh)" >> "$GITHUB_ENV"
      - run: '"$CORE_DIR/ci/gitleaks-install.sh" "$RUNNER_TEMP/bin"'
      - run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --exit-code 1 .'
        working-directory: app
