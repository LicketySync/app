# The Android shell (spike C, C1 and C4), on every push to main and every pull
# request: clippy for Android, the x86_64 and aarch64 debug APKs (debug-signed
# only), each APK's merged manifest (ci/check-manifest.sh), and the x86_64 one
# on an emulator of the pinned API level, where ci/emulator-check.sh checks
# the page, takes a screenshot and reads logcat, in airplane mode. The pinning
# rule is in checks.yml's header.
#
# Build hosts: Gradle's distribution (services.gradle.org, its SHA-256 in
# gradle-wrapper.properties), Google's Maven and Maven Central, through
# Gradle's dependency verification (mobile/gen/android/gradle/
# verification-metadata.xml), and the SDK's packages. No build scan. The app,
# once running, contacts no host itself; the Android System WebView it shows
# its page in asks Google Play services for fonts (the CHANGELOG says which),
# so the emulator check runs in airplane mode here.
#
# This job accepts the Android SDK's licence on the runner: sdkmanager needs
# it to install the pinned build tools, and android-emulator-runner to
# install the emulator and its system image.
name: android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  apks:
    name: debug APKs, their manifests, and the x86_64 one on the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - run: app/ci/pins-to-env.sh >> "$GITHUB_ENV"
      # The wrapper jar is one of Gradle's releases.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JDK }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy
          targets: x86_64-linux-android, aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          cache-workspace-crates: false
      - run: cargo install tauri-cli --version "$TAURI_CLI" --locked
      - name: Use the pinned NDK and install the pinned build tools
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK"
          if [ ! -d "$ndk" ]; then
            echo "NDK $ANDROID_NDK is not on this runner image; it has:" >&2
            ls "$ANDROID_HOME/ndk" >&2
            exit 1
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "build-tools;$ANDROID_BUILD_TOOLS"
      - run: cargo clippy --locked --workspace --lib --target aarch64-linux-android -- -D warnings
        working-directory: app
        env:
          RUSTFLAGS: -D warnings
      - name: Build the debug APKs
        run: cargo tauri android build --ci --debug --apk --split-per-abi --target x86_64 --target aarch64
        working-directory: app/mobile
      - name: Check each APK's merged manifest
        run: |
          for apk in app/mobile/gen/android/app/build/outputs/apk/*/debug/*.apk; do
            echo "== $apk"
            app/ci/check-manifest.sh "$apk"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: app/mobile/gen/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.ANDROID_PLATFORM }}
          system-image-api-level: ${{ env.ANDROID_SYSTEM_IMAGE_API }}
          target: google_apis
          arch: x86_64
          emulator-build: ${{ env.ANDROID_EMULATOR_BUILD }}
          emulator-options: -no-window -no-metrics -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: app/ci/emulator-check.sh app/mobile/gen/android/app/build/outputs/apk/x86_64/debug/app-x86_64-debug.apk emulator
      - name: Check the system image's revision
        run: |
          image="system-images;android-$ANDROID_SYSTEM_IMAGE_API;google_apis;x86_64"
          have=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed |
            awk -F'|' -v p="$image" '{ gsub(/ /, "", $1); gsub(/ /, "", $2) } $1 == p { print $2 }')
          if [ "$have" != "$ANDROID_SYSTEM_IMAGE_REVISION" ]; then
            echo "$image is revision ${have:-none}, not $ANDROID_SYSTEM_IMAGE_REVISION (ci/pins.env)" >&2
            exit 1
          fi
      # The emulator's evidence, whenever the check ran far enough to write
      # it; skipped when an earlier step failed before the emulator started.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('emulator/**') != '' }}
        with:
          name: emulator
          path: emulator
          if-no-files-found: error
          retention-days: 30
